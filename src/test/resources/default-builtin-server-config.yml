storage:
  path: /tmp/reindex/server
  engine: leveldb
  startwitherrors: false
  autorepair: false
net:
  httpaddr: "0.0.0.0:9088"
  rpcaddr: "0.0.0.0:6534"
  security: false
  ssl_cert: /tmp/reindex/builtin-server.crt
  ssl_key: /tmp/reindex/builtin-server.key
logger:
  serverlog: "stdout"
  corelog: "stdout"
  httplog: "stdout"
  rpclog: ""
  grpclog: ""
  loglevel: "error"
  server_loglevel: ""
  core_loglevel: ""
  http_loglevel: ""
  rpc_loglevel: ""
  grpc_loglevel: ""
system:
debug:
  pprof: false
  allocs: false
metrics:
  prometheus: false
  collect_period: 1000
  clientsstats: false
